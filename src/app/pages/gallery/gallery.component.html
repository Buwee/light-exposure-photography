<div class="min-h-screen bg-[#121212] pt-24 px-6 md:px-12">
  <h2 class="font-serif text-4xl md:text-6xl text-center mb-12 text-white">Gallery</h2>
  
  <!-- Main Gallery Grid -->
  <div *ngIf="!selectedCollection" class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-5xl mx-auto">
    <div *ngFor="let img of images" class="relative group overflow-hidden cursor-pointer aspect-square bg-gray-900" (click)="openCollection(img)">
      <img [src]="img.url" [alt]="img.title" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
      <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center p-4 z-10">
        <span class="text-white font-sans text-center uppercase tracking-widest text-sm">{{ img.title }}</span>
      </div>
    </div>
  </div>

  <!-- Collection View -->
  <div *ngIf="selectedCollection" class="max-w-6xl mx-auto animate-fade-in">
    <div class="flex items-center justify-between mb-12">
      <button (click)="closeCollection()" class="text-gray-500 hover:text-white transition-colors text-xs uppercase tracking-widest">← Back to Gallery</button>
      <h3 class="font-serif text-3xl text-white capitalize">{{ selectedCollection.replace('-', ' ') }}</h3>
      <div class="w-24"></div>
    </div>
    
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
      <div *ngFor="let imgUrl of currentCollectionImages; let i = index" class="relative group overflow-hidden cursor-pointer aspect-square bg-gray-900" (click)="openLightbox(i)">
        <img [src]="imgUrl" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
        <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
      </div>
    </div>
  </div>

  <!-- Lightbox Overlay -->
  <div *ngIf="selectedImage" 
       class="fixed inset-0 z-[100] bg-black/95 flex items-center justify-center p-4 md:p-12 transition-all duration-300"
       (click)="closeLightbox()">
    
    <!-- Image and Close Button Container -->
    <div class="relative flex flex-col items-center">
      <!-- Close Button -->
      <button (click)="closeLightbox(); $event.stopPropagation()" 
              class="absolute -top-12 right-0 text-white opacity-60 hover:opacity-100 transition-opacity z-[110] flex items-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
      
      <img [src]="selectedImage" 
           class="max-w-full max-h-[70vh] object-contain shadow-2xl animate-fade-in"
           (click)="$event.stopPropagation()">

      <!-- Caption & Metadata: Now correctly placed below the image -->
      <div *ngIf="selectedImageMetadata" class="mt-6 text-center max-w-2xl animate-fade-in">
        <p class="text-gray-400 font-sans text-sm leading-relaxed mb-3">{{ selectedImageMetadata.caption }}</p>
        <p class="text-gray-600 font-sans text-xs uppercase tracking-widest">{{ selectedImageMetadata.meta }}</p>
      </div>
    </div>

    <!-- Prev Arrow -->
    <button (click)="prevImage(); $event.stopPropagation()" 
            class="absolute left-8 p-4 text-white opacity-40 hover:opacity-100 transition-all z-[110] group">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
    </button>

    <!-- Next Arrow -->
    <button (click)="nextImage(); $event.stopPropagation()" 
            class="absolute right-8 p-4 text-white opacity-40 hover:opacity-100 transition-all z-[110] group">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </button>
  </div>
</div>
