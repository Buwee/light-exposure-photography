<div class="min-h-screen bg-[#121212] pt-24 px-6 md:px-12 pb-24">
  <div class="max-w-6xl mx-auto">
    <div class="flex items-center gap-4 mb-12">
      <a routerLink="/gallery" class="text-gray-500 hover:text-white transition-colors text-xs uppercase tracking-widest">← Back to Gallery</a>
      <h2 class="font-serif text-3xl md:text-5xl text-white capitalize">{{ category.replace('-', ' ') }}</h2>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let img of images" class="aspect-square overflow-hidden bg-gray-900">
        <img [src]="img" class="w-full h-full object-cover hover:scale-105 transition-transform duration-500">
      </div>
    </div>
  </div>
</div>
