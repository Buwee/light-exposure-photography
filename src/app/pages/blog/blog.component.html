<div class="min-h-screen bg-[#121212] pt-24 px-6 md:px-12 pb-24">
  <h2 class="font-serif text-4xl md:text-6xl text-center mb-16 text-white">Blog</h2>

  <div class="max-w-2xl mx-auto flex flex-col gap-8">
    <a *ngFor="let post of posts"
       [routerLink]="['/blog', post.id]"
       class="group flex flex-col md:flex-row md:items-baseline justify-between py-6 border-b border-gray-800 hover:border-gray-500 transition-colors">
      <h3 class="font-serif text-2xl md:text-3xl text-white group-hover:text-gray-300 transition-colors mb-2 md:mb-0">
        {{ post.title }}
      </h3>
      <span class="text-gray-500 text-xs uppercase tracking-widest font-sans">
        {{ post.date }}
      </span>
    </a>
  </div>
</div>
