<div class="min-h-screen bg-[#121212] pt-24 px-6 md:px-12 pb-24">
  <h2 class="font-serif text-4xl md:text-6xl text-center mb-16 text-white">Blog</h2>
  
  <div class="max-w-3xl mx-auto flex flex-col gap-24">
    <div *ngFor="let post of posts" class="flex flex-col gap-6 group cursor-pointer">
      
      <!-- Large Image -->
      <div class="aspect-[4/3] overflow-hidden bg-gray-800">
        <img [src]="post.imageUrl" [alt]="post.imageAlt" 
             class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
      </div>

      <!-- Text Content -->
      <div class="text-left">
        <div class="flex justify-between items-center mb-2">
          <p class="text-gray-500 text-xs uppercase tracking-widest">{{ post.date }}</p>
          
          <!-- Like Button -->
          <button (click)="toggleLike(post); $event.stopPropagation()" 
                  class="flex items-center gap-1.5 group/like transition-all duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" 
                 [class.text-red-500]="post.isLiked" 
                 [class.fill-current]="post.isLiked"
                 class="h-4 w-4 text-gray-500 group-hover/like:text-red-400 transition-colors" 
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.318a4.5 4.5 0 00-8.636-8.636L12 7.318l-7.682 7.318a4.5 4.5 0 00-2.364-8.636z" />
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
            </svg>
            <span class="text-gray-500 text-xs font-sans group-hover/like:text-red-400 transition-colors">{{ post.likes }}</span>
          </button>
        </div>
        
        <h3 class="font-serif text-3xl text-white mb-4 group-hover:text-gray-300 transition-colors">{{ post.title }}</h3>
        <p class="text-gray-400 font-sans leading-relaxed">
          {{ post.excerpt }}
        </p>
      </div>
    </div>
  </div>
</div>
