<div class="relative h-screen w-full overflow-hidden bg-black">
  <!-- Hero Image -->
  <div 
    class="absolute inset-0 z-0 bg-cover bg-center transition-all duration-300"
    [style.filter]="getFilterString()"
    style="background-image: url('assets/image1.png');"
  >
    <div class="absolute inset-0 bg-black/20"></div>
  </div>

  <!-- Rule of Thirds Grid -->
  <div *ngIf="effect === 'grid'" class="absolute inset-0 z-[1] pointer-events-none grid grid-cols-3 grid-rows-3 w-full h-full">
    <div class="border-r border-white/30"></div>
    <div class="border-r border-white/30"></div>
    <div></div>
    <div class="border-r border-white/30 border-t border-white/30"></div>
    <div class="border-r border-white/30 border-t border-white/30"></div>
    <div class="border-t border-white/30"></div>
    <div class="border-r border-white/30 border-b border-white/30"></div>
    <div class="border-r border-white/30 border-b border-white/30"></div>
    <div class="border-b border-white/30"></div>
  </div>

  <!-- Grain Overlay -->
  <div *ngIf="effect === 'grain'" class="absolute inset-0 z-[1] opacity-40 pointer-events-none mix-blend-overlay bg-[url('https://grainy-gradients.vercel.app/noise.svg')]"></div>
  <div *ngIf="effect === 'grain'" class="absolute inset-0 z-[2] opacity-20 pointer-events-none mix-blend-soft-light bg-[url('https://grainy-gradients.vercel.app/noise.svg')] scale-150"></div>

  <!-- Vignette Overlay -->
  <div *ngIf="effect === 'vignette'" class="absolute inset-0 z-[1] pointer-events-none bg-[radial-gradient(circle,_transparent_10%,_rgba(0,0,0,0.9)_100%)] opacity-100"></div>

  <!-- Intensified Light Leaks Overlay -->
  <div *ngIf="effect === 'lightleaks'" class="absolute inset-0 z-[1] pointer-events-none overflow-hidden">
    <!-- Large Soft Glows -->
    <div class="absolute top-[-10%] left-[-10%] w-[70%] h-[70%] rounded-full bg-orange-500/40 blur-[140px] mix-blend-screen animate-pulse"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] rounded-full bg-red-600/30 blur-[120px] mix-blend-screen animate-pulse" style="animation-delay: 1s"></div>
    <div class="absolute top-1/4 right-[-10%] w-[40%] h-[60%] rounded-full bg-yellow-400/20 blur-[100px] mix-blend-screen animate-pulse" style="animation-delay: 2s"></div>
    
    <!-- Vertical Light Streaks -->
    <div class="absolute top-0 left-1/4 w-px h-full bg-gradient-to-b from-transparent via-orange-300/50 to-transparent blur-sm rotate-12"></div>
    <div class="absolute top-0 right-1/3 w-px h-full bg-gradient-to-b from-transparent via-red-400/40 to-transparent blur-sm -rotate-6"></div>
    <div class="absolute top-0 left-1/3 w-px h-full bg-gradient-to-b from-transparent via-yellow-200/30 to-transparent blur-xs rotate-3"></div>
    
    <!-- Soft Haze across top -->
    <div class="absolute top-0 left-0 w-full h-32 bg-gradient-to-b from-orange-500/20 to-transparent blur-2xl mix-blend-screen"></div>
  </div>

  <!-- Typography Overlay -->
  <div class="relative z-10 flex h-full flex-col items-start justify-center text-left text-white px-12 md:px-24">
    <h1 class="font-serif text-6xl md:text-9xl tracking-tight mb-2">Light Exposure</h1>
    <p class="font-sans text-xl md:text-2xl uppercase tracking-[0.3em] opacity-80">Photography</p>
  </div>

  <app-exposure-slider 
    (exposureChanged)="onExposureChange($event)"
    (effectChanged)="onEffectChange($event)"
    (resetRequested)="onReset()">
  </app-exposure-slider>
</div>
