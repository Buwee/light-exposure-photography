<div class="min-h-screen bg-[#121212] pt-24 px-6 md:px-12 pb-24">
  <div class="max-w-3xl mx-auto">

    <!-- Back Link -->
    <a routerLink="/blog" class="inline-flex items-center gap-2 text-gray-500 hover:text-white transition-colors text-xs uppercase tracking-widest mb-12 group">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transition-transform group-hover:-translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0h8m-8 0v8m0 0l//L10 19" />
      </svg>
      Back to Blog
    </a>

    <article *ngIf="post" class="animate-fade-in">
      <!-- Header -->
      <div class="text-center mb-16">
        <span class="text-gray-500 text-xs uppercase tracking-[0.3em] font-sans">{{ post.date }}</span>
        <h1 class="font-serif text-4xl md:text-6xl text-white leading-tight mt-4 mb-8">{{ post.title }}</h1>
        <div class="w-16 h-px bg-gray-700 mx-auto"></div>
      </div>

      <!-- Content -->
      <div class="blog-content text-gray-400 font-sans leading-relaxed text-base md:text-lg space-y-8">
        <div [innerHTML]="formatBlogContent(post.content)"></div>
      </div>
    </article>
  </div>
</div>
